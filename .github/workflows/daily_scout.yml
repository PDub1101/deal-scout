name: Daily DealScout Scan & Refresh

on:
  schedule:
    # 7:00 AM EST is 12:00 UTC
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scout-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai python-dotenv requests fast-flights protobuf selectolax

      - name: Run DealScout Intelligence Scan
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AMADEUS_CLIENT_ID: ${{ secrets.AMADEUS_CLIENT_ID }}
          AMADEUS_CLIENT_SECRET: ${{ secrets.AMADEUS_CLIENT_SECRET }}
        run: |
          python scout_deals.py
          cp frontend/deals_data.js ./deals_data.js

      - name: Commit & push updated deal radar
        run: |
          git config user.name "DealScout Bot"
          git config user.email "dealscout-bot@users.noreply.github.com"
          git add data/deals_data.json data/deal_history.json frontend/deals_data.js deals_data.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update DealScout radar [skip ci]" && git push)
